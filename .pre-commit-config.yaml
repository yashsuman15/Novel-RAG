# .pre-commit-config.yaml
repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Prevent large files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict

      # Check for merge conflicts
      - id: check-merge-conflict

      # Ensure files end with newline
      - id: end-of-file-fixer

      # Trim trailing whitespace
      - id: trailing-whitespace

      # Check YAML syntax
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags

      # Check TOML syntax
      - id: check-toml

      # Check JSON syntax
      - id: check-json

      # Detect private keys
      - id: detect-private-key

  # Secret Detection - CRITICAL for security
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
          - '--exclude-files'
          - 'uv.lock|.*\.ipynb$'
        exclude: '.*/test_.*\.py$'

  # Python code formatting with Ruff (replaces Black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - pydantic
        args:
          - --ignore-missing-imports
          - --check-untyped-defs
          - --no-implicit-optional

  # Security linting with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args:
          - -c
          - pyproject.toml
        additional_dependencies: ["bandit[toml]"]

  # NOTE: python-safety-dependencies-check removed — it only supports Poetry.
  # Consider using `pip-audit` for dependency vulnerability scanning instead.

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--fix']

# Configuration for ci (optional - for pre-commit.ci service)
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [python-safety-dependencies-check]  # Skip safety check in CI (requires API)
  submodules: false
